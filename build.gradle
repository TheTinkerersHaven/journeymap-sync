buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
        maven {
            name = "GTNH Maven"
            url = "https://nexus.gtnewhorizons.com/repository/public/"
        }
    }
    dependencies {
        classpath 'com.gtnewhorizons:retrofuturagradle:1.4.9'
    }
}

apply plugin: 'com.gtnewhorizons.retrofuturagradle'

version = "0.2.3"
group = "com.gregorio.journeymapsync"
archivesBaseName = "JourneyMapSync"

minecraft {
    mcVersion = "1.7.10"

    // Use GTNH's Forge fork for maximum compatibility
    useDependencyAccessTransformers = false

    injectedTags.put("VERSION", project.version)
}

// GTNH 2.8.4 uses Java 17+
// Compile mod code to Java 8 bytecode: FML 1.7.10 discovery (ASM 5) cannot read
// class-file v61 in a stock dev environment; v08 loads everywhere incl. GTNH.
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}
repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    // JourneyMap 5.2.x API surface. deobf() remaps the release jar to dev (MCP) names so
    // it runs inside runClient; it is NOT bundled into the release jar.
    implementation rfg.deobf('maven.modrinth:journeymap:5.2.20')
    // Fallback: drop the jar in libs/ (gitignored) and comment the line above:
    // compileOnly files('libs/journeymap-1.7.10-5.2.20-unlimited.jar')
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.7.10"

    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": "1.7.10"
    }
}

jar {
    archiveBaseName.set("JourneyMapSync")
    archiveVersion.set(project.version.toString())
    archiveClassifier.set("")
}
